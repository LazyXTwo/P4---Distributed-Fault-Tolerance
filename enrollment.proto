syntax = "proto3";

package enrollment;


service EnrollmentService {

    rpc Login (LoginRequest) returns (LoginReply);

    rpc Logout (LogoutRequest) returns (LogoutReply);

    rpc GetCourses (GetCoursesRequest) returns (GetCoursesReply);

    rpc Enroll (EnrollRequest) returns (EnrollReply);

    rpc AddStudent (AddStudentRequest) returns (AddStudentReply);

    rpc AddCourse (AddCourseRequest) returns (AddCourseReply);

    rpc UploadGrade (UploadGradeRequest) returns (UploadGradeReply);

    rpc GetGrades (GetGradesRequest) returns (GetGradesReply);
}


message LoginRequest {
    string username = 1;
    string password = 2;
}


message LoginReply {
    bool success = 1;
    string message = 2;
    string session_token = 3;
    string role = 4;
}


message LogoutRequest {
    string session_token = 1;
}


message LogoutReply {
    bool success = 1;
    string message = 2;
}


message GetCoursesRequest {
    string session_token = 1;
}


message Course {
    string course_code = 1;
    string course_name = 2;
    int32 slots = 3;
}


message GetCoursesReply {
    bool success = 1;
    string message = 2;
    repeated Course courses = 3;
}


message EnrollRequest {
    string session_token = 1;
    string course_code = 2;
}


message EnrollReply {
    bool success = 1;
    string message = 2;
}


// ============================================================
// Add student
// ============================================================

message AddStudentRequest {
    string session_token = 1;
    string username = 2;
    string password = 3;
}


message AddStudentReply {
    bool success = 1;
    string message = 2;
}


// ============================================================
// Add course
// ============================================================

message AddCourseRequest {
    string session_token = 1;
    string course_code = 2;
    string course_name = 3;
    int32 slots = 4;
}


message AddCourseReply {
    bool success = 1;
    string message = 2;
}


// ============================================================
// Upload grade
// ============================================================

message UploadGradeRequest {
    string session_token = 1;
    string student_username = 2;
    string course_code = 3;
    double grade = 4;
}


message UploadGradeReply {
    bool success = 1;
    string message = 2;
}


// ============================================================
// Get grades
// ============================================================

message GetGradesRequest {
    string session_token = 1;
}


message Grade {
    string course_code = 1;
    string course_name = 2;
    double grade = 3;
}


message GetGradesReply {
    bool success = 1;
    string message = 2;
    repeated Grade grades = 3;
}